version: "3.9"

services:
  db:
    image: mariadb:11
    container_name: bmi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Test12
      MYSQL_DATABASE: bmi_localization
    ports:
      - "3306:3306"   # optional (only if you want to access DB from host)
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: bmi-app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: bmi_localization
      DB_USER: root
      DB_PASSWORD: Test12
    restart: on-failure

volumes:
  db_data: